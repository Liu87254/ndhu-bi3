<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苗栗縣科技執法設備與取締件數統計</title>
    
    <!-- 載入外部套件 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- 內建樣式 -->
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #1a365d;
            color: #ffffff;
            text-align: center;
            padding: 2.5rem 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }

        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #1a365d;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
            font-size: 1.4rem;
        }

        #map {
            height: 480px;
            width: 100%;
            border-radius: 6px;
            background: #e2e8f0;
        }

        .chart-container {
            position: relative;
            height: 420px;
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>苗栗縣科技執法設備取締地點與件數統計</h1>
        <p>提供苗栗縣轄區內科技執法設置地點、座標及 113 年下半年取締件數視覺化分析</p>
    </header>

    <main class="container">
        <!-- 地圖區塊 -->
        <section class="card">
            <h2>科技執法設備分佈地圖</h2>
            <div id="map"></div>
        </section>

        <!-- 圖表區塊 -->
        <section class="card">
            <h2>各地點取締件數統計 (113年下半年)</h2>
            <div class="chart-container">
                <canvas id="enforcementChart"></canvas>
            </div>
        </section>
    </main>

    <footer>
        <p>資料來源：苗栗縣政府警察局公開資料</p>
    </footer>

    <!-- 內建腳本 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 1. 初始化地圖 (定位至苗栗)
            const map = L.map('map').setView([24.565, 120.820], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // 2. 讀取地點 CSV
            Papa.parse("苗栗縣科技執法設備取締地點.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                encoding: "Big5", // 自動支援中文字碼
                complete: function (results) {
                    const data = results.data;
                    data.forEach(item => {
                        // 自動尋找欄位（防止欄位名稱因編碼有微小差異）
                        const lat = parseFloat(item['座標緯度'] || item['緯度']);
                        const lng = parseFloat(item['座標經度'] || item['經度']);
                        const location = item['設置地點(路口或路段)'] || item['設置地點'] || '未知地點';
                        const type = item['科技執法種類'] || '科技執法';
                        const items = item['取締項目(以"、"分隔)'] || item['取締項目'] || '';

                        if (!isNaN(lat) && !isNaN(lng)) {
                            L.marker([lat, lng]).addTo(map)
                                .bindPopup(`
                                    <div style="font-size: 14px;">
                                        <b style="color: #1a365d;">${location}</b><br>
                                        <b>種類：</b>${type}<br>
                                        <b>項目：</b>${items}
                                    </div>
                                `);
                        }
                    });
                }
            });

            // 3. 讀取件數 CSV 並繪圖
            Papa.parse("113年下半年取締件數.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                encoding: "Big5",
                complete: function (results) {
                    const data = results.data;
                    const labels = [];
                    const counts = [];

                    data.forEach(item => {
                        let locationName = item['設置地點'] ? item['設置地點'].replace(/\n/g, ' ') : '未知地點';
                        labels.push(locationName);

                        let rawCount = item['取締件數'] || "0";
                        let countNum = parseInt(rawCount.replace(/[^0-9]/g, ''), 10) || 0;
                        counts.push(countNum);
                    });

                    const ctx = document.getElementById('enforcementChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: '113年下半年取締件數',
                                data: counts,
                                backgroundColor: 'rgba(26, 54, 93, 0.7)',
                                borderColor: 'rgba(26, 54, 93, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    title: { display: true, text: '件數 (件)' }
                                },
                                x: {
                                    ticks: {
                                        callback: function(val, index) {
                                            let label = this.getLabelForValue(index);
                                            return label.length > 10 ? label.substr(0, 10) + '...' : label;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
